cv:
  name: Vasily Dunaev
  label: Robotics R&D Engineer
  email: vasilysent@gmail.com
  location: Amsterdam, The Netherlands
  website: https://vasilysent.github.io
  summary: Robotics R&D engineer with an MSc in Applied Mathematics and BSc in Robotics, focused on robot dynamics, control, numerical simulation, and mathematical modelling of physical systems. I work across geometric mechanics, simulation, and model-based and learning-based control, with hands-on experience building robotic systems.

  social_networks:
    - network: GitHub
      username: vasilysent
    - network: LinkedIn
      username: vasilysent

  sections:
    Education:
      - institution: University of Twente
        location: Enschede, The Netherlands
        area: Applied Mathematics
        studyType: MSc
        start_date: 2023-09
        end_date: 2025-08
        highlights:
          - "Grade: 9.8/10"
          - "Thesis: [Geometric structure of Cosserat elasticity](https://purl.utwente.nl/essays/108602). Supervisor: Frederic P. Schuller."

      - institution: University of Twente
        location: Enschede, The Netherlands
        area: Erasmus+ Exchange
        studyType: Exchange
        start_date: 2022-02
        end_date: 2023-02
        highlights:
          - "Grade: 9/10"

      - institution: ITMO University
        location: St Petersburg, Russia
        area: Robotics
        studyType: BSc
        start_date: 2019-09
        end_date: 2023-06
        highlights:
          - "Grade: 4.6/5"
          - Designed and organised an experimental advanced BSc programme in Robotics focused on fundamental subjects. Initially created for my group, the programme was later adopted for subsequent cohorts.

    Experience:
      - company: University of Twente
        position: Graduate Researcher
        location: Enschede, The Netherlands
        start_date: 2025-09
        end_date: 2026-09
        summary: Developed a differential-geometric formulation of the kinematics and dynamics of Cosserat continua, enabling the treatment of general continua with residual stresses. Manuscript in preparation for submission, draft on request.

      - company: University of Twente
        position: Instructor
        location: Enschede, The Netherlands
        start_date: 2022-09
        end_date: 2025-11
        summary: Co-taught a master's course on robot modelling, kinematics, and dynamics with Stefano Stramigioli.
        highlights:
          - Covered rigid transformations, twists, wrenches, robot kinematics, dynamics, and torque control.
          - Delivered lectures and tutorial sessions; designed assignments and exams.
          - Produced [lecture notes](https://github.com/vasilysent/robotics_course/blob/main/notes.pdf) and video lectures.

      - company: KdVI Institute, University of Amsterdam
        position: Research Intern
        location: Amsterdam, The Netherlands
        start_date: 2025-03
        end_date: 2025-06
        summary: Built reusable software for structure-preserving numerical integration on matrix Lie groups, including stable simulation tools for rigid-body dynamics on SO(3) and SE(3).

      - company: Youth Robotics Lab, ITMO University
        position: Engineer
        location: St Petersburg, Russia
        start_date: 2016-09
        end_date: 2022-01
        highlights:
          - "**Robot-Artist** — led a team of eight building a painting robot. Implemented the robot's motion control, stroke-sequence generation using genetic and simulated-annealing algorithms, designed and built the hardware."
          - "**ELSA** — created a humanoid robot that plays the flute; designed the CAD model and built the 3D-printed robot's hands. RoboCup Junior 2019 winner."
          - "**Strawberry Fields** — developed an autonomous strawberry-harvesting prototype; trained a CNN for berry detection and designed a soft robotic gripper. 1st place at the World Robot Olympiad 2018."
          - "**Teaching** — developed and taught a course on CAD 3D modelling and 3D printing."

    Projects:
      - name: Reinforcement Learning Robotics Project
        start_date: 2026-05
        end_date: 2026-05
        summary: Built a MuJoCo simulation of a torque-controlled UR5e for 6D end-effector pose tracking. Combined a geometric SE(3) spring-damper controller with an RL residual policy that outputs a virtual end-effector wrench.

